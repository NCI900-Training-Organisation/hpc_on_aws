# ---------------------------------------------------------
# SSH Password Authentication (Rocky 9.6 Safe)
# ---------------------------------------------------------
- name: Configure SSH password authentication safely
  hosts: all
  become: yes
  gather_facts: yes

  tasks:

    # -----------------------------------------------------
    # Cloud-init SSH configuration override
    # -----------------------------------------------------
    - name: Ensure cloud-init allows SSH password authentication
      lineinfile:
        path: /etc/cloud/cloud.cfg
        regexp: '^ssh_pwauth:'
        line: "ssh_pwauth: true"
        create: yes
      tags: [ssh, cloud_init]

    # -----------------------------------------------------
    # Remove cloud image SSH restriction overrides
    # -----------------------------------------------------
    - name: Remove cloudimg SSH restriction file if present
      file:
        path: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
        state: absent
      tags: [ssh, cleanup]

    # -----------------------------------------------------
    # Main SSH daemon configuration
    # -----------------------------------------------------
    - name: Enable PasswordAuthentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: "PasswordAuthentication yes"
      notify: Restart sshd
      tags: [ssh, auth]

    - name: Disable ChallengeResponseAuthentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?ChallengeResponseAuthentication'
        line: "ChallengeResponseAuthentication no"
      notify: Restart sshd
      tags: [ssh, auth]

    - name: Ensure PAM is enabled
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?UsePAM'
        line: "UsePAM yes"
      notify: Restart sshd
      tags: [ssh, pam]

    # -----------------------------------------------------
    # Strong override via sshd drop-in (highest precedence)
    # -----------------------------------------------------
    - name: Enforce PasswordAuthentication via drop-in config
      copy:
        dest: /etc/ssh/sshd_config.d/99-password-auth.conf
        content: |
          PasswordAuthentication yes
        owner: root
        group: root
        mode: "0644"
      notify: Restart sshd
      tags: [ssh, override]

  # ---------------------------------------------------------
  # SAFE HANDLER (no reboot required)
  # ---------------------------------------------------------
  handlers:
    - name: Restart sshd
      systemd:
        name: sshd
        state: restarted