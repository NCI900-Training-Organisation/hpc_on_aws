---
# =========================================================
# Play 1: Setup groups, users, and /apps structure
# =========================================================
- name: Setup spackadmin, cuda users, and filesystem
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_group: spackadmin
    spack_user: spackuser
    spack_dir: /apps
    current_user: rocky

    # CUDA user settings
    cuda_group: cudauser
    user_count: 40
    user_prefix: "user"
    default_password: "CHANGE_ME_NOW"

  tasks:

    # -----------------------------------------------------
    # GROUPS
    # -----------------------------------------------------
    - name: Create spackadmin group
      group:
        name: "{{ spack_group }}"
        state: present
      tags: [groups, spack]

    - name: Create cudauser group
      group:
        name: "{{ cuda_group }}"
        state: present
      tags: [groups, cuda]

    # -----------------------------------------------------
    # USERS (Spack admins)
    # -----------------------------------------------------
    - name: Create spack user
      user:
        name: "{{ spack_user }}"
        groups: "{{ spack_group }}"
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present
      tags: [users, spack]

    - name: Ensure current admin user is in spackadmin group
      user:
        name: "{{ current_user }}"
        groups: "{{ spack_group }}"
        append: yes
      tags: [users, spack, admin]

    # -----------------------------------------------------
    # CUDA USERS
    # -----------------------------------------------------
    - name: Create CUDA users
      user:
        name: "{{ user_prefix }}{{ item }}"
        groups: "{{ cuda_group }}"
        append: yes
        shell: /bin/bash
        create_home: yes
        password: "{{ default_password | password_hash('sha512') }}"
        state: present
      loop: "{{ range(1, user_count + 1) | list }}"
      tags: [users, cuda, bulk]

    # -----------------------------------------------------
    # SUDO ACCESS
    # -----------------------------------------------------
    - name: Grant passwordless sudo to spackadmin group
      copy:
        dest: "/etc/sudoers.d/{{ spack_group }}"
        content: "{{ spack_group }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
      tags: [sudo, security]

    # -----------------------------------------------------
    # /apps BASE DIRECTORY
    # -----------------------------------------------------
    - name: Ensure /apps exists with correct permissions
      file:
        path: "{{ spack_dir }}"
        state: directory
        owner: root
        group: "{{ spack_group }}"
        mode: "2775"
      tags: [filesystem, apps, spack]

    # -----------------------------------------------------
    # python_venv DIRECTORY (IMPORTANT)
    # -----------------------------------------------------
    - name: Create python_venv directory
      file:
        path: "{{ spack_dir }}/python_venv"
        state: directory
        owner: root
        group: "{{ spack_group }}"
        mode: "2775"
      tags: [filesystem, venv]

    # -----------------------------------------------------
    # ENSURE GROUP MEMBERSHIP CONSISTENCY
    # -----------------------------------------------------
    - name: Ensure spackuser is in spackadmin group
      user:
        name: "{{ spack_user }}"
        groups: "{{ spack_group }}"
        append: yes
      tags: [users, spack, fix]


# =========================================================
# Play 2: ACL configuration
# =========================================================
- name: Configure ACL permissions
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_dir: /apps
    cuda_group: cudauser

  tasks:

    # -----------------------------------------------------
    # ACL PACKAGE
    # -----------------------------------------------------
    - name: Ensure ACL package is installed
      dnf:
        name: acl
        state: present
      tags: [packages, acl]

    # -----------------------------------------------------
    # /apps READ ACCESS FOR CUDA USERS
    # -----------------------------------------------------
    - name: Grant read/execute to cudauser on /apps
      acl:
        path: "{{ spack_dir }}"
        entity: "{{ cuda_group }}"
        etype: group
        permissions: rx
        state: present
      tags: [acl, cuda]

    - name: Set default ACL on /apps for cudauser
      acl:
        path: "{{ spack_dir }}"
        entity: "{{ cuda_group }}"
        etype: group
        permissions: rx
        default: yes
        state: present
      tags: [acl, cuda, defaults]

    # -----------------------------------------------------
    # python_venv ACL (EXPLICIT CONTROL)
    # -----------------------------------------------------
    - name: Grant read/execute to cudauser on python_venv
      acl:
        path: "{{ spack_dir }}/python_venv"
        entity: "{{ cuda_group }}"
        etype: group
        permissions: rx
        state: present
      tags: [acl, venv]

    - name: Set default ACL on python_venv
      acl:
        path: "{{ spack_dir }}/python_venv"
        entity: "{{ cuda_group }}"
        etype: group
        permissions: rx
        default: yes
        state: present
      tags: [acl, venv, defaults]

    # -----------------------------------------------------
    # OPTIONAL REBOOT
    # -----------------------------------------------------
    - name: Reboot nodes
      reboot:
        reboot_timeout: 600
        test_command: whoami
      tags: [reboot]