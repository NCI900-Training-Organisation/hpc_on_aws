---
# =========================================================
# Play 1: Setup spackadmin group, users, and /apps access
# =========================================================
- name: Setup spackadmin group, users, and secure /apps
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_group: spackadmin
    spack_user: spackuser
    spack_dir: /apps
    current_user: rocky

    # CUDA user settings
    cuda_group: cudauser
    user_count: 40
    user_prefix: "user"
    default_password: "CHANGE_ME_NOW"

  tasks:

    # -----------------------------------------------------
    # GROUPS
    # -----------------------------------------------------
    - name: Create spackadmin group
      group:
        name: "{{ spack_group }}"
        state: present
      tags: [groups, spack]

    - name: Create cudauser group
      group:
        name: "{{ cuda_group }}"
        state: present
      tags: [groups, cuda]

    # -----------------------------------------------------
    # USERS (Spack admins)
    # -----------------------------------------------------
    - name: Create spack user
      user:
        name: "{{ spack_user }}"
        groups: "{{ spack_group }}"
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present
      tags: [users, spack]

    - name: Ensure rocky is in spackadmin group
      user:
        name: "{{ current_user }}"
        groups: "{{ spack_group }}"
        append: yes
      tags: [users, spack, admin]

    # -----------------------------------------------------
    # CUDA USERS
    # -----------------------------------------------------
    - name: Create CUDA users
      user:
        name: "{{ user_prefix }}{{ item }}"
        groups: "{{ cuda_group }}"
        append: yes
        shell: /bin/bash
        create_home: yes
        password: "{{ default_password | password_hash('sha512') }}"
        state: present
      loop: "{{ range(1, user_count + 1) | list }}"
      tags: [users, cuda, bulk]

    # -----------------------------------------------------
    # SUDO ACCESS (Spack admins only)
    # -----------------------------------------------------
    - name: Grant passwordless sudo to spackadmin group
      copy:
        dest: "/etc/sudoers.d/{{ spack_group }}"
        content: "{{ spack_group }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
      tags: [sudo, security]

    # -----------------------------------------------------
    # /apps ACCESS MODEL (CRITICAL FIX)
    # -----------------------------------------------------
    - name: Ensure /apps directory exists with group control
      file:
        path: "{{ spack_dir }}"
        state: directory
        owner: root
        group: "{{ spack_group }}"
        mode: "2775"
      tags: [filesystem, spack, apps]

    # Ensure spackuser is explicitly part of spackadmin
    - name: Ensure spackuser is in spackadmin group
      user:
        name: "{{ spack_user }}"
        groups: "{{ spack_group }}"
        append: yes
      tags: [users, spack, fix]


# =========================================================
# Play 2: Configure ACL permissions for cudauser on /apps
# =========================================================
- name: Configure ACL permissions for cudauser group
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_dir: /apps
    cuda_group: cudauser

  tasks:

    # -----------------------------------------------------
    # ACL PACKAGE
    # -----------------------------------------------------
    - name: Ensure ACL package is installed
      dnf:
        name: acl
        state: present
      tags: [packages, acl]

    # -----------------------------------------------------
    # CUDA ACCESS (read-only to Spack tree)
    # -----------------------------------------------------
    - name: Grant read/execute access to cudauser on /apps
      acl:
        path: "{{ spack_dir }}"
        entity: "{{ cuda_group }}"
        etype: group
        permissions: rx
        state: present
      tags: [acl, cuda]

    - name: Set default ACL for cudauser on /apps
      acl:
        path: "{{ spack_dir }}"
        entity: "{{ cuda_group }}"
        etype: group
        permissions: rx
        default: yes
        state: present
      tags: [acl, cuda, defaults]

    # -----------------------------------------------------
    # REBOOT (optional - usually avoid in production)
    # -----------------------------------------------------
    - name: Reboot nodes
      reboot:
        reboot_timeout: 600
        test_command: whoami
      tags: [reboot]