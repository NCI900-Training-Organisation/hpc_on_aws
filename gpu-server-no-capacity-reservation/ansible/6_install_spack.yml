# ---------------------------------------------------------
# Play 3: Install Spack into /apps/spack
# ---------------------------------------------------------
- name: Install Spack into /apps
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    app_dir: /apps
    spack_dir: /apps/spack
    git_repo: "https://github.com/spack/spack.git"
    deploy_user: "rocky"

  tasks:

    # -----------------------------------------------------
    # Ensure base directory exists
    # -----------------------------------------------------
    - name: Create /apps directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    # -----------------------------------------------------
    # Clone Spack (idempotent)
    # -----------------------------------------------------
    - name: Clone Spack repository
      git:
        repo: "{{ git_repo }}"
        dest: "{{ spack_dir }}"
        version: develop
        update: yes
      become_user: "{{ deploy_user }}"

    # -----------------------------------------------------
    # Fix ownership recursively (only spack dir)
    # -----------------------------------------------------
    - name: Ensure correct ownership of Spack directory
      file:
        path: "{{ spack_dir }}"
        state: directory
        recurse: yes
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"

# ---------------------------------------------------------
# Play 4: Configure Spack system-wide
# ---------------------------------------------------------
- name: Configure Spack environment globally
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_dir: /apps/spack

  tasks:

    - name: Create Spack environment script
      copy:
        dest: /etc/profile.d/spack.sh
        content: |
          # Spack environment setup
          export SPACK_ROOT={{ spack_dir }}
          if [ -f "$SPACK_ROOT/share/spack/setup-env.sh" ]; then
              . "$SPACK_ROOT/share/spack/setup-env.sh"
          fi
        owner: root
        group: root
        mode: "0644"

# ---------------------------------------------------------
# Play 5: Validate Spack installation
# ---------------------------------------------------------
- name: Validate Spack installation
  hosts: all
  become: yes
  gather_facts: no

  tasks:

    - name: Check Spack version
      shell: |
        source /etc/profile.d/spack.sh
        spack --version
      register: spack_version
      changed_when: false

    - name: Show Spack version
      debug:
        msg: "Spack version: {{ spack_version.stdout }}"

    # -----------------------------------------------------
    # Reboot
    # -----------------------------------------------------
    - name: Reboot nodes
      reboot:
        reboot_timeout: 600
        test_command: whoami
      tags: reboot