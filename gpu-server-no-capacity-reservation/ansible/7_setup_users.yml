# ---------------------------------------------------------
# Play 8: Setup spackadmin Group and Secure /apps Access
# ---------------------------------------------------------
- name: Setup spackadmin group and users with /apps permissions
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_group: spackadmin
    spack_user: spackuser
    spack_dir: /apps
    current_user: rocky

  tasks:

    # -----------------------------------------------------
    # Create group
    # -----------------------------------------------------
    - name: Create group "{{ spack_group }}"
      group:
        name: "{{ spack_group }}"
        state: present

    # -----------------------------------------------------
    # Create spack user
    # -----------------------------------------------------
    - name: Create spack user "{{ spack_user }}"
      user:
        name: "{{ spack_user }}"
        groups: "{{ spack_group }}"
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present

    # -----------------------------------------------------
    # Add admin user (rocky)
    # -----------------------------------------------------
    - name: Add current admin user to spack group
      user:
        name: "{{ current_user }}"
        groups: "{{ spack_group }}"
        append: yes

    # -----------------------------------------------------
    # Sudo access for group
    # -----------------------------------------------------
    - name: Grant passwordless sudo to spackadmin
      copy:
        dest: "/etc/sudoers.d/{{ spack_group }}"
        content: "{{ spack_group }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"

    # -----------------------------------------------------
    # /apps ownership model (clean + consistent)
    # -----------------------------------------------------
    - name: Set /apps ownership
      file:
        path: "{{ spack_dir }}"
        state: directory
        owner: root
        group: "{{ spack_group }}"
        mode: "2775"   # setgid + group writable

# ---------------------------------------------------------
# Play 9: Create CUDA user group and users (Rocky-safe)
# ---------------------------------------------------------
- name: Create CUDA user group and multiple users
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    user_count: 40
    default_password: "CHANGE_ME_NOW"
    user_prefix: "user"

  tasks:

    # -----------------------------------------------------
    # Create CUDA group
    # -----------------------------------------------------
    - name: Create cudauser group
      group:
        name: cudauser
        state: present

    # -----------------------------------------------------
    # Create users
    # -----------------------------------------------------
    - name: Create CUDA users
      user:
        name: "{{ user_prefix }}{{ item }}"
        groups: cudauser
        append: yes
        shell: /bin/bash
        create_home: yes
        password: "{{ default_password | password_hash('sha512') }}"
        state: present
      loop: "{{ range(1, user_count + 1) | list }}"