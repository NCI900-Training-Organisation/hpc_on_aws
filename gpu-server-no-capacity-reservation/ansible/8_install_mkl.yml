---
- name: Install optimized math libraries via Spack
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_root: /apps/spack
    spack_user: spackuser

    mkl_pkg: intel-oneapi-mkl
    arm_pkg: openblas  # or blis

  tasks:

    # -----------------------------------------------------
    # Detect architecture
    # -----------------------------------------------------
    - name: Set architecture type
      set_fact:
        is_x86: "{{ ansible_facts['architecture'] == 'x86_64' }}"
        is_arm: "{{ ansible_facts['architecture'] in ['aarch64', 'arm64'] }}"

    - name: Show architecture
      debug:
        msg: "Architecture = {{ ansible_facts['architecture'] }}"

    # -----------------------------------------------------
    # Load Spack env once (reuse pattern)
    # -----------------------------------------------------
    - name: Define Spack environment loader
      set_fact:
        spack_env: "source {{ spack_root }}/share/spack/setup-env.sh"

    # -----------------------------------------------------
    # Ensure compilers
    # -----------------------------------------------------
    - name: Detect compilers
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack compiler find
      args:
        executable: /bin/bash
      changed_when: false

    # -----------------------------------------------------
    # INSTALL: x86 → MKL
    # -----------------------------------------------------
    - name: Check MKL
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack find --format '{name}' {{ mkl_pkg }}
      args:
        executable: /bin/bash
      register: mkl_check
      changed_when: false
      when: is_x86

    - name: Install MKL (x86 only)
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack install {{ mkl_pkg }} %gcc
      args:
        executable: /bin/bash
      when:
        - is_x86
        - mkl_check.stdout.strip() == ""

    # -----------------------------------------------------
    # INSTALL: ARM → OpenBLAS (or BLIS)
    # -----------------------------------------------------
    - name: Check OpenBLAS
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack find --format '{name}' {{ arm_pkg }}
      args:
        executable: /bin/bash
      register: blas_check
      changed_when: false
      when: is_arm

    - name: Install OpenBLAS (ARM fallback)
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack install {{ arm_pkg }} %gcc
      args:
        executable: /bin/bash
      when:
        - is_arm
        - blas_check.stdout.strip() == ""

    # -----------------------------------------------------
    # Modules refresh (common)
    # -----------------------------------------------------
    - name: Refresh Spack modules
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack module tcl refresh -y
      args:
        executable: /bin/bash

    # -----------------------------------------------------
    # Dynamic module path (FIX your hardcoding issue)
    # -----------------------------------------------------
    - name: Configure module path dynamically
      copy:
        dest: /etc/profile.d/spack-modules.sh
        mode: '0755'
        content: |
          export MODULEPATH={{ spack_root }}/share/spack/modules/linux-$(uname -m):$MODULEPATH

    # -----------------------------------------------------
    # Verification
    # -----------------------------------------------------
    - name: Verify install
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack find
      args:
        executable: /bin/bash
      register: verify
      changed_when: false

    - debug:
        var: verify.stdout_lines