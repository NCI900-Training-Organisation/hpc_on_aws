# ---------------------------------------------------------
# Play 11: Install Intel MKL via Spack (HPC-safe version)
# ---------------------------------------------------------
- name: Install Intel MKL using Spack
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_root: /apps/spack
    spack_mkl_package: intel-oneapi-mkl

  environment:
    SPACK_ROOT: "{{ spack_root }}"
    PATH: "{{ spack_root }}/bin:{{ ansible_env.PATH }}"

  tasks:

    # -----------------------------------------------------
    # Verify Spack environment
    # -----------------------------------------------------
    - name: Check Spack is available
      command: "{{ spack_root }}/bin/spack --version"
      register: spack_version
      changed_when: false
      tags: mkl,spack

    - name: Detect available compilers
      shell: |
        source {{ spack_root }}/share/spack/setup-env.sh
        spack compilers
      args:
        executable: /bin/bash
      register: compiler_list
      changed_when: false
      tags: mkl,spack

    - name: Show compilers
      debug:
        var: compiler_list.stdout_lines
      tags: mkl,spack

    # -----------------------------------------------------
    # Install MKL (idempotent check)
    # -----------------------------------------------------
    - name: Check if Intel MKL is already installed
      shell: |
        source {{ spack_root }}/share/spack/setup-env.sh
        spack find {{ spack_mkl_package }}
      args:
        executable: /bin/bash
      register: mkl_check
      changed_when: false
      failed_when: false
      tags: mkl

    - name: Install Intel MKL via Spack (only if missing)
      shell: |
        source {{ spack_root }}/share/spack/setup-env.sh
        spack install {{ spack_mkl_package }}
      args:
        executable: /bin/bash
      when: "'No package matches' in mkl_check.stderr or mkl_check.rc != 0"
      tags: mkl

    # -----------------------------------------------------
    # Load MKL environment (system-wide)
    # -----------------------------------------------------
    - name: Create MKL environment module script
      copy:
        dest: /etc/profile.d/mkl.sh
        mode: '0755'
        content: |
          # Intel MKL via Spack
          export SPACK_ROOT={{ spack_root }}
          source {{ spack_root }}/share/spack/setup-env.sh
          spack load {{ spack_mkl_package }}
      tags: mkl

    # -----------------------------------------------------
    # Verification
    # -----------------------------------------------------
    - name: Verify MKL installation
      shell: |
        source {{ spack_root }}/share/spack/setup-env.sh
        spack find {{ spack_mkl_package }}
      args:
        executable: /bin/bash
      register: mkl_verify
      changed_when: false
      tags: mkl,verify

    - name: Show MKL install status
      debug:
        var: mkl_verify.stdout_lines
      tags: verify

    # -----------------------------------------------------
    # Reboot
    # -----------------------------------------------------
    - name: Reboot nodes
      reboot:
        reboot_timeout: 600
        test_command: whoami
      tags: reboot