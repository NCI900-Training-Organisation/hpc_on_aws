# ---------------------------------------------------------
# Play 10: Grant ACL Permissions on /apps to cudauser Group
# ---------------------------------------------------------
- name: Configure ACL permissions for cudauser on /apps
  hosts: all
  become: yes
  gather_facts: yes

  tasks:

    # -----------------------------------------------------
    # Install ACL tools (Rocky Linux)
    # -----------------------------------------------------
    - name: Ensure ACL package is installed
      dnf:
        name: acl
        state: present

    # -----------------------------------------------------
    # Ensure base ACL permission (group access)
    # -----------------------------------------------------
    - name: Grant group read/execute permissions on /apps
      acl:
        path: /apps
        entity: cudauser
        etype: group
        permissions: rx
        state: present

    # -----------------------------------------------------
    # Default ACL (inherit for new files)
    # -----------------------------------------------------
    - name: Set default ACL for cudauser group on /apps
      acl:
        path: /apps
        entity: cudauser
        etype: group
        permissions: rx
        default: yes
        state: present