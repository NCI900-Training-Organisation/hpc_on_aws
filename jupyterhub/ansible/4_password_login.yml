---
- name: Harden and configure SSH on Rocky 9 safely
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    ssh_dropin_file: /etc/ssh/sshd_config.d/99-ansible-hardening.conf

  tasks:

    # -----------------------------------------------------
    # Remove known cloud image SSH overrides (safe cleanup)
    # -----------------------------------------------------
    - name: Remove cloudimg SSH restriction file if present
      file:
        path: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
        state: absent
      tags: [ssh, cleanup]

    # -----------------------------------------------------
    # Ensure drop-in directory exists (defensive)
    # -----------------------------------------------------
    - name: Ensure sshd_config.d exists
      file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [ssh, setup]

    # -----------------------------------------------------
    # Apply SSH configuration via single authoritative drop-in
    # -----------------------------------------------------
    - name: Configure SSH authentication settings (drop-in)
      copy:
        dest: "{{ ssh_dropin_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # -------------------------------------------------
          # SSH configuration managed by Ansible
          # -------------------------------------------------

          PasswordAuthentication yes
          ChallengeResponseAuthentication no
          UsePAM yes

          # Security hardening (safe defaults)
          PermitRootLogin no
          MaxAuthTries 3
      notify: Reload sshd
      tags: [ssh, auth]

    # -----------------------------------------------------
    # Validate SSH configuration before applying reload
    # -----------------------------------------------------
    - name: Validate sshd configuration
      command: sshd -t
      register: sshd_test
      changed_when: false
      tags: [ssh, validate]

    - name: Fail if sshd config is invalid
      fail:
        msg: "sshd configuration test failed: {{ sshd_test.stderr }}"
      when: sshd_test.rc != 0
      tags: [ssh, validate]

  handlers:

    # -----------------------------------------------------
    # Safe reload (does NOT drop active SSH sessions)
    # -----------------------------------------------------
    - name: Reload sshd
      systemd:
        name: sshd
        state: reloaded