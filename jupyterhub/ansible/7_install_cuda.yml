# ---------------------------------------------------------
# Play 11: Install CUDA via Spack (Rocky 9.6 GPU Nodes)
# ---------------------------------------------------------
- name: Install CUDA using Spack
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_root: /apps/spack
    spack_cuda_version: "12.8"


  tasks:

    # -----------------------------------------------------
    # Ensure Spack environment is usable
    # -----------------------------------------------------
    - name: Source Spack and detect compilers
      shell: |
        source {{ spack_root }}/share/spack/setup-env.sh
        spack compiler find || true
        spack compilers
      args:
        executable: /bin/bash
      register: spack_compilers
      changed_when: false
      tags: [cuda, compiler, spack]

    - name: Show detected compilers
      debug:
        var: spack_compilers.stdout_lines
      tags: [cuda, compiler, spack]

    # -----------------------------------------------------
    # Check if CUDA is already installed (idempotent)
    # -----------------------------------------------------
    - name: Check if CUDA {{ spack_cuda_version }} is installed
      shell: |
        source {{ spack_root }}/share/spack/setup-env.sh
        spack find cuda@{{ spack_cuda_version }}
      args:
        executable: /bin/bash
      register: cuda_check
      changed_when: false
      failed_when: false
      tags: [cuda, spack]

    # -----------------------------------------------------
    # Install CUDA only if missing
    # -----------------------------------------------------
    - name: Install CUDA {{ spack_cuda_version }}
      shell: |
        source {{ spack_root }}/share/spack/setup-env.sh
        spack install cuda@{{ spack_cuda_version }}
      args:
        executable: /bin/bash
      register: cuda_install
      retries: 3
      delay: 30
      when: cuda_check.stdout == ""
      until: cuda_install.rc == 0
      tags: [cuda, spack, install]

    # -----------------------------------------------------
    # Show installed Spack packages
    # -----------------------------------------------------
    - name: List installed Spack packages
      shell: |
        source {{ spack_root }}/share/spack/setup-env.sh
        spack find
      args:
        executable: /bin/bash
      register: spack_find
      changed_when: false
      tags: [spack, list]

    - name: Output installed packages
      debug:
        var: spack_find.stdout_lines
      tags: [spack, list]

    # -----------------------------------------------------
    # Reboot
    # -----------------------------------------------------
    - name: Reboot nodes
      reboot:
        reboot_timeout: 600
        test_command: whoami
      tags: reboot