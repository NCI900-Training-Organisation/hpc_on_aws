---
- name: Install optimized math libraries via Spack 
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    spack_root: /apps/spack
    spack_user: spackuser

    mkl_pkg: intel-oneapi-mkl
    blas_pkg: openblas   # swap to blis if desired

  tasks:

    # =====================================================
    # DETECTION LAYER (architecture + CPU vendor)
    # =====================================================

    - name: Set architecture type
      set_fact:
        is_x86: "{{ ansible_facts['architecture'] in ['x86_64', 'amd64'] }}"
        is_arm: "{{ ansible_facts['architecture'] in ['aarch64', 'arm64'] }}"
      tags: [detect]

    - name: Detect CPU vendor from /proc/cpuinfo
      shell: |
        grep -m 1 "vendor_id" /proc/cpuinfo | awk '{print $3}'
      register: cpu_vendor_raw
      changed_when: false
      tags: [detect]

    - name: Set CPU vendor fact
      set_fact:
        cpu_vendor: "{{ cpu_vendor_raw.stdout | default('unknown') }}"
      tags: [detect]

    - name: Decide math library (final logic)
      set_fact:
        use_mkl: "{{ is_x86 and cpu_vendor == 'GenuineIntel' }}"
        use_openblas: "{{ is_arm or cpu_vendor == 'AuthenticAMD' or cpu_vendor == 'unknown' }}"
      tags: [detect]

    - name: Show detection summary
      debug:
        msg:
          - "Architecture: {{ ansible_facts['architecture'] }}"
          - "CPU Vendor: {{ cpu_vendor }}"
          - "Use MKL: {{ use_mkl }}"
          - "Use OpenBLAS: {{ use_openblas }}"
      tags: [detect]

    # =====================================================
    # SPACK SETUP
    # =====================================================

    - name: Define Spack environment loader
      set_fact:
        spack_env: "source {{ spack_root }}/share/spack/setup-env.sh"
      tags: [spack]

    - name: Warm up Spack
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack list > /dev/null
      args:
        executable: /bin/bash
      changed_when: false
      tags: [spack]

    - name: Detect compilers
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack compiler find
      args:
        executable: /bin/bash
      changed_when: false
      tags: [spack, compiler]

    # =====================================================
    # INTEL MKL PATH
    # =====================================================

    - name: Check MKL (safe)
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack find --format '{name}' {{ mkl_pkg }} || true
      args:
        executable: /bin/bash
      register: mkl_check
      changed_when: false
      when: use_mkl
      tags: [mkl, check]

    - name: Install MKL (Intel only)
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack install {{ mkl_pkg }} %gcc threads=openmp
      args:
        executable: /bin/bash
      when:
        - use_mkl
        - mkl_check.stdout.strip() == ""
      tags: [mkl, install]

    # =====================================================
    # AMD / ARM PATH (OpenBLAS / BLIS)
    # =====================================================

    - name: Check BLAS
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack find --format '{name}' {{ blas_pkg }} || true
      args:
        executable: /bin/bash
      register: blas_check
      changed_when: false
      when: use_openblas
      tags: [blas, check]

    - name: Install BLAS (OpenBLAS / BLIS)
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack install {{ blas_pkg }} %gcc
      args:
        executable: /bin/bash
      when:
        - use_openblas
        - blas_check.stdout.strip() == ""
      tags: [blas, install]

    # =====================================================
    # MODULE SYSTEM
    # =====================================================

    - name: Refresh Spack modules
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack module tcl refresh -y
      args:
        executable: /bin/bash
      tags: [modules]

    - name: Configure module path dynamically
      copy:
        dest: /etc/profile.d/spack-modules.sh
        mode: '0755'
        content: |
          export MODULEPATH={{ spack_root }}/share/spack/modules/linux-$(uname -m):$MODULEPATH
      tags: [modules]

    # =====================================================
    # VERIFICATION
    # =====================================================

    - name: Verify installation
      become_user: "{{ spack_user }}"
      shell: |
        {{ spack_env }}
        spack find
      args:
        executable: /bin/bash
      register: verify
      changed_when: false
      tags: [verify]

    - name: Show installed packages
      debug:
        var: verify.stdout_lines
      tags: [verify]